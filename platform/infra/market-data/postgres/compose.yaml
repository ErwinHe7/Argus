services:
  postgres:
    image: postgres:17-bookworm
    container_name: axio7-market-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: axio7_market
      POSTGRES_USER: axio7
      POSTGRES_PASSWORD: ${MARKET_POSTGRES_PASSWORD:?set MARKET_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - axio7-market-postgres-data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-market-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axio7 -d axio7_market"]
      interval: 5s
      timeout: 3s
      retries: 20
    labels:
      axio7.scope: local-research

volumes:
  axio7-market-postgres-data:
