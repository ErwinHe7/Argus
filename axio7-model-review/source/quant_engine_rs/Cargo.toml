[package]
name = "axio-quant-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Data-first, point-in-time SPX intraday research and execution engine"
license = "Proprietary"

[lib]
name = "axio_quant_engine"
path = "src/lib.rs"

[[bin]]
name = "quantd"
path = "src/bin/quantd.rs"

[[bin]]
name = "quantctl"
path = "src/bin/quantctl.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["json", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4.5", features = ["derive", "env"] }
csv = "1.4"
databento = "0.55"
dotenvy = "0.15"
futures-util = "0.3"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "0.38", features = ["bundled", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1.49", features = ["full"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.20", features = ["v4", "serde"] }

[dev-dependencies]
approx = "0.5"
tempfile = "3.24"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
