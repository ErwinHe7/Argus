:root[data-theme=&quot;light&quot;] {

:root[data-theme=&quot;dark&quot;] {

* {

}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans);

  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {

  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {

h1 {

}

h2 {

  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {

  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {

}

code:not(pre code) {

  padding: 1px 6px;

  corner-shape: superellipse(1.5);

  font-family: var(--font-mono);

  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;

}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {

}

}

.table :is(.text-center, [align=&quot;center&quot;]) {

}

.table .text-nowrap {

}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.progress {
  display: flex;
  height: 6px;
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,

  font: inherit;
}

.btn {
  appearance: button;

  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;

}

.btn:is(.btn-block, .viz-tile) {

}

  min-width: 0;

  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);

}

  color: var(--muted-foreground);
  background: transparent;

  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

  display: block;

  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);

  min-height: 72px;
  padding: 8px 10px;

}

.form-control:focus-visible {
  border-color: var(--ring);

.form-control:disabled,
.form-select:disabled {

  opacity: 0.4;

.form-select:not(:disabled):hover {

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);

.form-check {

  min-height: 20px;

  gap: 6px;

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;

  border: 1px solid var(--input);
  color: var(--primary-foreground);

                  &lt;div style=&quot;display:flex;justify-content:space-between;gap:24px&quot;&gt;&lt;span&gt;SCENARIO&lt;/span&gt;&lt;b&gt;${money(scenario)}&lt;/b&gt;&lt;/div&gt;
                  &lt;div style=&quot;display:flex;justify-content:space-between;gap:24px&quot;&gt;&lt;span&gt;INTERVAL&lt;/span&gt;&lt;b&gt;${money(low)}—${money(high)}&lt;/b&gt;&lt;/div&gt;
                  &lt;div style=&quot;display:flex;justify-content:space-between;gap:24px&quot;&gt;&lt;span&gt;QUALITY&lt;/span&gt;&lt;b&gt;COMPLETE&lt;/b&gt;&lt;/div&gt;
                  &lt;div style=&quot;display:flex;justify-content:space-between;gap:24px&quot;&gt;&lt;span&gt;MODEL&lt;/span&gt;&lt;b&gt;EXP-001 / FIXTURE&lt;/b&gt;&lt;/div&gt;
                &lt;/div&gt;` : &#x27;&#x27;;
              const outcomeRow = isOutcome ? `
                &lt;div style=&quot;border-top:1px solid ${foreground};margin-top:8px;padding-top:8px;display:flex;justify-content:space-between;gap:24px&quot;&gt;&lt;span&gt;REALIZED +5M&lt;/span&gt;&lt;b&gt;${signed(realizedBps)} BPS&lt;/b&gt;&lt;/div&gt;` : &#x27;&#x27;;
              return `&lt;div style=&quot;min-width:220px;padding:10px 11px;color:${foreground};background:${background};font:11px/1.55 &#x27;Helvetica Neue&#x27;,Arial,sans-serif&quot;&gt;
                &lt;div style=&quot;display:flex;justify-content:space-between;gap:24px;font-weight:500&quot;&gt;&lt;span&gt;24 JUL 2026&lt;/span&gt;&lt;span&gt;${et(bar[0])} ET&lt;/span&gt;&lt;/div&gt;
                &lt;div style=&quot;border-top:1px solid ${foreground};margin-top:8px;padding-top:8px&quot;&gt;
                  &lt;div style=&quot;display:flex;justify-content:space-between;gap:24px&quot;&gt;&lt;span&gt;OPEN&lt;/span&gt;&lt;b&gt;${money(bar[1],3)}&lt;/b&gt;&lt;/div&gt;
                  &lt;div style=&quot;display:flex;justify-content:space-between;gap:24px&quot;&gt;&lt;span&gt;HIGH&lt;/span&gt;&lt;b&gt;${money(bar[4],3)}&lt;/b&gt;&lt;/div&gt;
                  &lt;div style=&quot;display:flex;justify-content:space-between;gap:24px&quot;&gt;&lt;span&gt;LOW&lt;/span&gt;&lt;b&gt;${money(bar[3],3)}&lt;/b&gt;&lt;/div&gt;
                  &lt;div style=&quot;display:flex;justify-content:space-between;gap:24px&quot;&gt;&lt;span&gt;CLOSE&lt;/span&gt;&lt;b&gt;${money(bar[2],3)}&lt;/b&gt;&lt;/div&gt;
                  &lt;div style=&quot;display:flex;justify-content:space-between;gap:24px&quot;&gt;&lt;span&gt;VOLUME&lt;/span&gt;&lt;b&gt;${bar[5].toLocaleString()}&lt;/b&gt;&lt;/div&gt;
                &lt;/div&gt;${predictionRows}${outcomeRow}
              &lt;/div&gt;`;
            }
          },
          series: [
            {
              name: &#x27;OHLC&#x27;, type: &#x27;candlestick&#x27;, data: candles,
              itemStyle: {
                color: color(&#x27;--spy-up&#x27;), color0: color(&#x27;--spy-down&#x27;),
                borderColor: color(&#x27;--spy-up&#x27;), borderColor0: color(&#x27;--spy-down&#x27;)
              },
              markLine: {
                silent: true, symbol: [&#x27;none&#x27;,&#x27;none&#x27;],
                label: { show: false },
                lineStyle: { color: foreground, type: &#x27;dashed&#x27;, width: 1 },
                data: [{ xAxis: labels[cutoff] }]
              }
            },
            {
              name: &#x27;Forecast&#x27;, type: &#x27;line&#x27;, data: forecast, connectNulls: true,
              symbol: &#x27;diamond&#x27;, symbolSize: 8,
              lineStyle: { color: trendColor, width: 2, type: &#x27;dashed&#x27; },
              itemStyle: { color: trendColor }
            },
            {
              name: &#x27;Interval&#x27;, type: &#x27;custom&#x27;, data: interval,
              renderItem: (params, api) =&gt; {
                const value = interval[params.dataIndex];
                if (!value) return null;
                const a = api.coord([params.dataIndex, value[0]]);
                const b = api.coord([params.dataIndex, value[1]]);
                return { type: &#x27;group&#x27;, children: [
                  { type: &#x27;line&#x27;, shape: { x1:a[0],y1:a[1],x2:b[0],y2:b[1] }, style: { stroke:trendColor,lineWidth:2 } },
                  { type: &#x27;line&#x27;, shape: { x1:a[0]-5,y1:a[1],x2:a[0]+5,y2:a[1] }, style: { stroke:trendColor,lineWidth:2 } },
                  { type: &#x27;line&#x27;, shape: { x1:b[0]-5,y1:b[1],x2:b[0]+5,y2:b[1] }, style: { stroke:trendColor,lineWidth:2 } }
                ]};
              }
            },
            { name: &#x27;Volume&#x27;, type: &#x27;bar&#x27;, xAxisIndex: 1, yAxisIndex: 1, data: volumes, barMaxWidth: 7 }
          ]
        }, true);

        requestAnimationFrame(() =&gt; chart.dispatchAction({ type: &#x27;showTip&#x27;, seriesIndex: 0, dataIndex: cutoff }));
      };

      range.addEventListener(&#x27;input&#x27;, () =&gt; {
        cutoff = Number(range.value);
        revealed = false;
        revealButton.disabled = false;
        revealButton.textContent = &#x27;Reveal +5m&#x27;;
        render();
      });

      revealButton.addEventListener(&#x27;click&#x27;, () =&gt; {
        revealed = true;
        revealButton.disabled = true;
        revealButton.textContent = &#x27;Revealed&#x27;;
        render();
        requestAnimationFrame(() =&gt; chart.dispatchAction({ type: &#x27;showTip&#x27;, seriesIndex: 0, dataIndex: cutoff + 5 }));
      });

      themeButton.addEventListener(&#x27;click&#x27;, () =&gt; {
        const nextTheme = root.dataset.theme === &#x27;dark&#x27; ? &#x27;light&#x27; : &#x27;dark&#x27;;
        root.dataset.theme = nextTheme;
        themeButton.textContent = nextTheme === &#x27;dark&#x27; ? &#x27;Light&#x27; : &#x27;Dark&#x27;;
        themeButton.setAttribute(&#x27;aria-label&#x27;, `Switch to ${nextTheme === &#x27;dark&#x27; ? &#x27;light&#x27; : &#x27;dark&#x27;} mode`);
        chart.clear();
        render();
      });

      new ResizeObserver(() =&gt; chart.resize()).observe(chartNode);
      render();
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

(() =&gt; {
