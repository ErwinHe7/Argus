              format: uuid
              type: string
          required:
            - request_id
          type: object
      required:
        - data
        - meta
      type: object
    BrokerageAccount:
      additionalProperties: false
      properties:
        base_currency:
          pattern: ^[A-Z]{3}$
          type: string
        capabilities:
          items:
            $ref: "#/components/schemas/BrokerageCapability"
          maxItems: 64
          type: array
        capability_version:
          minimum: 0
          type: integer
        connection_id:
          format: uuid
          type: string
        display_label:
          maxLength: 160
          minLength: 1
          type: string
        expires_at:
          format: date-time
          nullable: true
          type: string
        fetched_at:
          format: date-time
          nullable: true
          type: string
        id:
          format: uuid
          type: string
        market_timezone:
          maxLength: 64
          minLength: 1
          nullable: true
          type: string
        provider_observed_at:
          format: date-time
          nullable: true
          type: string
        selected:
          type: boolean
        state:
          enum:
            - fresh
            - empty
            - stale
            - partial
            - unavailable
            - offline
            - rate_limited
            - disconnected
            - reauthorization_required
          type: string
        status:
          enum:
            - available
            - restricted
            - closed
            - unavailable
          type: string
      required:
        - id
        - connection_id
        - display_label
        - base_currency
        - market_timezone
        - status
        - capability_version
        - capabilities
        - state
        - selected
        - provider_observed_at
        - fetched_at
        - expires_at
      type: object
    BrokerageAccountAuthority:
      additionalProperties: false
      nullable: true
      properties:
        base_currency:
          pattern: ^[A-Z]{3}$
          type: string
        capabilities:
          items:
            $ref: "#/components/schemas/BrokerageCapability"
          maxItems: 64
          type: array
        capability_version:
          minimum: 0
          type: integer
        display_label:
          maxLength: 160
          minLength: 1
          type: string
        market_timezone:
          maxLength: 64
          minLength: 1
          type: string
        status:
          enum:
            - available
            - restricted
            - closed
            - unavailable
          type: string
      required:
        - display_label
        - base_currency
        - market_timezone
        - status
        - capability_version
        - capabilities
      type: object
    BrokerageAccountsResponse:
      additionalProperties: false
      properties:
        data:
          items:
            $ref: "#/components/schemas/BrokerageAccount"
          maxItems: 100
          type: array
        meta:
          additionalProperties: false
          properties:
            request_id:
              format: uuid
              type: string
          required:
            - request_id
          type: object
      required:
        - data
        - meta
      type: object
    BrokerageAsset:
      additionalProperties: false
      properties:
        asset_kind:
          enum:
            - equity
            - etf
            - unsupported
          type: string
        currency:
          pattern: ^[A-Z]{3}$
          type: string
        exchange:
          maxLength: 32
          nullable: true
          type: string
        instrument_id:
          format: uuid
          type: string
        market_timezone:
          maxLength: 64
          minLength: 1
          type: string
        name:
          maxLength: 160
          minLength: 1
          type: string
        provider_asset_kind:
          maxLength: 128
          minLength: 1
          type: string
        supported:
          type: boolean
        symbol:
          maxLength: 32
          minLength: 1
          type: string
      required:
        - instrument_id
        - symbol
        - name
        - asset_kind
        - provider_asset_kind
        - supported
        - currency
        - exchange
        - market_timezone
      type: object
    BrokerageBalance:
      additionalProperties: false
      nullable: true
      properties:
        buying_power:
          nullable: true
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d{1,18})?$
          type: string
        cash:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d{1,18})?$
          type: string
        currency:
          pattern: ^[A-Z]{3}$
          type: string
        market_value:
          nullable: true
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d{1,18})?$
          type: string
        total_equity:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d{1,18})?$
          type: string
      required:
        - currency
        - cash
        - buying_power
        - market_value
        - total_equity
      type: object
    BrokerageBalancesProjection:
      additionalProperties: false
      properties:
        account_id:
          format: uuid
          type: string
        data:
          $ref: "#/components/schemas/BrokerageBalance"
        expires_at:
          format: date-time
          nullable: true
          type: string
        fetched_at:
          format: date-time
          nullable: true
          type: string
        generation:
          exclusiveMinimum: true
          minimum: 0
          nullable: true
          type: integer
        provider_observed_at:
          format: date-time
          nullable: true
          type: string
        reason:
          maxLength: 64
          nullable: true
          type: string
        resource:
          enum:
            - account
            - balance
            - positions
            - restrictions
          type: string
        state:
          enum:
            - fresh
            - empty
            - stale
            - partial
            - unavailable
            - offline
            - rate_limited
            - disconnected
            - reauthorization_required
          type: string
      required:
        - account_id
        - resource
        - generation
        - state
        - reason
        - provider_observed_at
        - fetched_at
        - expires_at
        - data
      type: object
    BrokerageBalancesResponse:
      additionalProperties: false
      properties:
        data:
