        - id
        - instrument_id
        - symbol
        - side
        - provider_side
        - order_type
        - provider_order_type
        - time_in_force
        - provider_time_in_force
        - quantity
        - filled_quantity
        - limit_price
        - stop_price
        - average_fill_price
        - currency
        - state
        - provider_state
        - terminal
