          nullable: true
          type: integer
        provider_observed_at:
          format: date-time
          nullable: true
          type: string
        reason:
          maxLength: 64
          nullable: true
          type: string
        resource:
          enum:
            - account
            - balance
            - positions
            - restrictions
          type: string
        state:
          enum:
            - fresh
            - empty
            - stale
            - partial
            - unavailable
            - offline
            - rate_limited
            - disconnected
            - reauthorization_required
          type: string
      required:
        - account_id
        - resource
        - generation
        - state
        - reason
        - provider_observed_at
        - fetched_at
        - expires_at
        - data
      type: object
    BrokerageCapabilitiesResponse:
      additionalProperties: false
