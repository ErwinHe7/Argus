          nullable: true
          type: integer
        observed_at:
          format: date-time
          type: string
        price_minor:
          minimum: 0
          type: integer
        source_label:
          maxLength: 120
          minLength: 1
          type: string
      required:
        - observed_at
        - price_minor
        - change_bps
        - expense_ratio_bps
        - source_label
        - demo
      type: object
    AssetMetricsResponse:
      additionalProperties: false
      properties:
        data:
