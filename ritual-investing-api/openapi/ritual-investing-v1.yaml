          enum:
            - balances_read
            - positions_read
            - orders_read
            - manual_orders
            - unsupported
          type: string
        provider_code:
          maxLength: 128
          minLength: 1
          type: string
      required:
        - capability
        - provider_code
        - available
      type: object
    BrokerageOrder:
      additionalProperties: false
      properties:
        average_fill_price:
          nullable: true
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d{1,18})?$
