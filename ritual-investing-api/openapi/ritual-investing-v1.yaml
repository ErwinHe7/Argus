          type: string
        name:
          maxLength: 120
          minLength: 1
          type: string
        revision_id:
          format: uuid
          type: string
        slug:
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          type: string
        symbol:
          maxLength: 16
          minLength: 1
          type: string
      required:
        - id
        - slug
        - symbol
        - name
        - asset_type
        - currency
        - revision_id
        - appearance_reason
        - demo
