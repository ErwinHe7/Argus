        provider_time_in_force:
          maxLength: 128
          minLength: 1
          type: string
        quantity:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d{1,18})?$
          type: string
        side:
          enum:
            - buy
            - sell
            - unsupported
          type: string
        source:
          enum:
