components:
  parameters: {}
  schemas:
    AssetCodexDetail:
      additionalProperties: false
      properties:
        appearance_reason:
          maxLength: 1000
          minLength: 1
          type: string
        asset_type:
          enum:
            - equity
            - etf
            - market_index
            - cash
          type: string
        currency:
          pattern: ^[A-Z]{3}$
          type: string
        demo:
          $ref: "#/components/schemas/ResearchDisclosure"
        evidence:
          items:
            $ref: "#/components/schemas/EvidenceSummary"
          maxItems: 20
          type: array
        id:
          format: uuid
          type: string
        limitations:
          maxLength: 2000
          minLength: 1
          type: string
        metrics_as_of:
          format: date-time
          type: string
        name:
          maxLength: 160
          minLength: 1
          type: string
        revision_id:
          format: uuid
          type: string
        risks:
          items:
            $ref: "#/components/schemas/AssetRisk"
          maxItems: 20
          type: array
        saved:
          type: boolean
        slug:
          maxLength: 120
          minLength: 1
          type: string
        symbol:
          maxLength: 32
          minLength: 1
          type: string
        thesis:
          maxLength: 10000
          minLength: 1
          type: string
      required:
        - id
        - slug
        - symbol
        - name
        - asset_type
        - currency
        - revision_id
        - appearance_reason
        - demo
        - thesis
        - limitations
        - metrics_as_of
        - evidence
        - risks
        - saved
      type: object
    AssetCollectionResponse:
      additionalProperties: false
      properties:
        data:
          items:
            $ref: "#/components/schemas/AssetSummary"
          maxItems: 100
          type: array
        meta:
          $ref: "#/components/schemas/CollectionMeta"
      required:
        - data
        - meta
      type: object
    AssetComparison:
      additionalProperties: false
      properties:
        assets:
          items:
            additionalProperties: false
            properties:
              asset:
                $ref: "#/components/schemas/AssetSummary"
              latest_metric:
                $ref: "#/components/schemas/AssetMetric"
              risk_count:
                minimum: 0
                type: integer
            required:
              - asset
              - latest_metric
              - risk_count
            type: object
          maxItems: 5
          minItems: 2
          type: array
        compared_at:
          format: date-time
          type: string
        demo:
          $ref: "#/components/schemas/ResearchDisclosure"
      required:
        - assets
        - compared_at
        - demo
      type: object
    AssetComparisonResponse:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/AssetComparison"
        meta:
          additionalProperties: false
          properties:
            request_id:
              format: uuid
              type: string
          required:
            - request_id
          type: object
      required:
        - data
        - meta
      type: object
    AssetDetailResponse:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/AssetCodexDetail"
        meta:
          additionalProperties: false
          properties:
            request_id:
              format: uuid
              type: string
          required:
            - request_id
          type: object
      required:
        - data
        - meta
      type: object
    AssetEvidenceResponse:
      additionalProperties: false
      properties:
        data:
          items:
            $ref: "#/components/schemas/EvidenceDetail"
          maxItems: 20
          type: array
        meta:
          additionalProperties: false
          properties:
            request_id:
              format: uuid
              type: string
          required:
            - request_id
          type: object
      required:
        - data
        - meta
      type: object
    AssetMetric:
      additionalProperties: false
      nullable: true
      properties:
        change_bps:
          nullable: true
          type: integer
        demo:
          $ref: "#/components/schemas/ResearchDisclosure"
        expense_ratio_bps:
          minimum: 0
          nullable: true
          type: integer
        observed_at:
          format: date-time
          type: string
        price_minor:
          minimum: 0
          type: integer
        source_label:
          maxLength: 120
          minLength: 1
          type: string
      required:
        - observed_at
        - price_minor
        - change_bps
        - expense_ratio_bps
        - source_label
        - demo
      type: object
    AssetMetricsResponse:
      additionalProperties: false
      properties:
        data:
          items:
            $ref: "#/components/schemas/AssetMetric"
          maxItems: 90
          type: array
        meta:
          additionalProperties: false
          properties:
            request_id:
              format: uuid
              type: string
          required:
            - request_id
          type: object
      required:
        - data
        - meta
      type: object
    AssetRisk:
      additionalProperties: false
      properties:
        detail:
          maxLength: 2000
          minLength: 1
          type: string
        severity:
          enum:
            - low
            - medium
            - high
          type: string
        title:
          maxLength: 120
          minLength: 1
          type: string
      required:
        - title
        - detail
        - severity
      type: object
    AssetSummary:
      additionalProperties: false
      properties:
        appearance_reason:
          maxLength: 1000
          minLength: 1
          type: string
        asset_type:
          enum:
            - equity
            - etf
            - market_index
            - cash
          type: string
        currency:
          pattern: ^[A-Z]{3}$
          type: string
        demo:
          $ref: "#/components/schemas/ResearchDisclosure"
        id:
          format: uuid
          type: string
        name:
          maxLength: 160
          minLength: 1
          type: string
        revision_id:
          format: uuid
          type: string
        slug:
          maxLength: 120
          minLength: 1
          type: string
        symbol:
          maxLength: 32
          minLength: 1
          type: string
      required:
        - id
        - slug
        - symbol
        - name
        - asset_type
        - currency
        - revision_id
        - appearance_reason
        - demo
      type: object
    AstrologyProfile:
      additionalProperties: false
      nullable: true
      properties:
        algorithm_version:
          enum:
            - v1
          type: string
        birth_date:
          format: date
          type: string
        deletion_epoch:
          minimum: 0
          nullable: true
          type: integer
        derived_profile_code:
          enum:
            - lunar_patient
            - solar_builder
            - rising_explorer
          type: string
        enabled_at:
          format: date-time
          type: string
        user_id:
          format: uuid
          type: string
        version:
          maximum: 1
          minimum: 1
          type: integer
      required:
        - user_id
        - deletion_epoch
        - birth_date
        - derived_profile_code
        - algorithm_version
        - enabled_at
        - version
      type: object
    AstrologyProfileResponse:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/AstrologyProfile"
        meta:
          additionalProperties: false
          properties:
            request_id:
              format: uuid
              type: string
          required:
            - request_id
          type: object
      required:
        - data
        - meta
      type: object
    BriefingCollectionResponse:
      additionalProperties: false
      properties:
        data:
          items:
            $ref: "#/components/schemas/BriefingSummary"
          maxItems: 100
          type: array
        meta:
          $ref: "#/components/schemas/CollectionMeta"
      required:
        - data
        - meta
      type: object
    BriefingDetail:
      additionalProperties: false
      properties:
        briefing_type:
          enum:
            - daily
            - weekly
            - moon_cycle
          type: string
        generated_at:
          format: date-time
          type: string
        generation:
          exclusiveMinimum: true
          minimum: 0
          type: integer
        id:
          format: uuid
          type: string
        period_end:
          format: date
          type: string
        period_start:
          format: date
          type: string
        read_at:
          format: date-time
          nullable: true
          type: string
        sections:
          items:
            $ref: "#/components/schemas/BriefingSection"
          maxItems: 100
          type: array
        source_sequence:
          exclusiveMinimum: true
          minimum: 0
          type: integer
      required:
        - id
        - briefing_type
        - period_start
        - period_end
        - generated_at
        - generation
        - source_sequence
        - read_at
        - sections
      type: object
    BriefingDetailResponse:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/BriefingDetail"
        meta:
          additionalProperties: false
          properties:
            request_id:
              format: uuid
              type: string
          required:
            - request_id
          type: object
      required:
        - data
        - meta
      type: object
    BriefingPending:
      additionalProperties: false
      properties:
        local_date:
          format: date
          type: string
        status:
          enum:
            - briefing_pending
          type: string
      required:
        - status
        - local_date
      type: object
    BriefingPendingResponse:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/BriefingPending"
        meta:
          additionalProperties: false
          properties:
            request_id:
              format: uuid
              type: string
          required:
            - request_id
          type: object
      required:
        - data
        - meta
      type: object
    BriefingSection:
      additionalProperties: false
      properties:
        disclosure:
          maxLength: 2000
          minLength: 1
          type: string
        ordinal:
          exclusiveMinimum: true
          minimum: 0
          type: integer
        schema_version:
          exclusiveMinimum: true
          minimum: 0
          type: integer
        source_sequence:
          exclusiveMinimum: true
          minimum: 0
          type: integer
      required:
        - ordinal
        - source_sequence
        - schema_version
        - disclosure
      type: object
    BriefingSummary:
      additionalProperties: false
      properties:
        briefing_type:
          enum:
            - daily
            - weekly
            - moon_cycle
          type: string
        generated_at:
          format: date-time
          type: string
        generation:
          exclusiveMinimum: true
          minimum: 0
          type: integer
        id:
          format: uuid
          type: string
        period_end:
          format: date
          type: string
        period_start:
          format: date
          type: string
        read_at:
          format: date-time
          nullable: true
          type: string
        source_sequence:
          exclusiveMinimum: true
          minimum: 0
          type: integer
      required:
        - id
        - briefing_type
        - period_start
        - period_end
        - generated_at
        - generation
        - source_sequence
        - read_at
      type: object
    BriefingSummaryResponse:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/BriefingSummary"
        meta:
