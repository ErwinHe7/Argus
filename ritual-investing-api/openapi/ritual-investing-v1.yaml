                        type: array
                      message:
                        type: string
                      request_id:
                        format: uuid
                        type: string
                      retryable:
                        type: boolean
                    required:
                      - code
                      - message
                      - request_id
                      - field_errors
                      - retryable
                    type: object
                required:
