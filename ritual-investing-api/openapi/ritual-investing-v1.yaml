    get:
      operationId: getAccount
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    nullable: true
                  meta:
                    additionalProperties: false
                    properties:
                      request_id:
                        format: uuid
                        type: string
                    required:
                      - request_id
                    type: object
                required:
                  - meta
                type: object
          description: Argus response.
        "401":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                      field_errors:
                        items:
                          nullable: true
                        type: array
                      message:
                        type: string
                      request_id:
                        format: uuid
                        type: string
                      retryable:
                        type: boolean
                    required:
                      - code
                      - message
                      - request_id
                      - field_errors
                      - retryable
                    type: object
                required:
                  - error
                type: object
          description: Invalid Supabase access token.
        "403":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                      field_errors:
                        items:
                          nullable: true
                        type: array
                      message:
                        type: string
                      request_id:
                        format: uuid
                        type: string
                      retryable:
                        type: boolean
                    required:
                      - code
                      - message
                      - request_id
                      - field_errors
                      - retryable
                    type: object
                required:
                  - error
                type: object
          description: Owner or current staff authorization denied.
        "409":
          content:
            application/json:
              schema:
                additionalProperties: false
