        currency:
          pattern: ^[A-Z]{3}$
          type: string
        filled_quantity:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d{1,18})?$
          type: string
        id:
          format: uuid
          type: string
        instrument_id:
          format: uuid
          type: string
        limit_price:
          nullable: true
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d{1,18})?$
          type: string
        order_type:
