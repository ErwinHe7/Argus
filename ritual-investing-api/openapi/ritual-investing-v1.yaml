  securitySchemes:
    Auth0OAuth:
      description: Auth0 Authorization Code with PKCE access token for the Ritual API audience.
      flows:
        authorizationCode:
          authorizationUrl: https://YOUR_AUTH0_DOMAIN/authorize
          scopes:
            admin:operations:read: Read bounded staff operational metadata.
            privacy:self: Run export and deletion requests.
            read:self: Read the member's own Ritual data.
            simulate:self: Run deterministic Demo commands.
            write:self: Update the member's own Ritual data.
          tokenUrl: https://YOUR_AUTH0_DOMAIN/oauth/token
      type: oauth2
    CloudflareAccess:
      description: Cloudflare Access application assertion required in addition to the Auth0 API token.
      in: header
      name: Cf-Access-Jwt-Assertion
      type: apiKey
info:
  description: Contract for deterministic research, private member state, simulated investing, and audited staff operations.
  title: Ritual Investing API
  version: 1.0.0
openapi: 3.0.3
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
          description: Worker liveness without a database dependency.
      security: []
      tags:
        - Platform
  /v1/admin/session:
    get:
      operationId: getAdminSession
      parameters:
        - in: header
          name: cf-access-jwt-assertion
          required: true
          schema:
            maxLength: 16384
            minLength: 1
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionResponse"
          description: Verified active staff session.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Missing or invalid token pair.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Inactive or unauthorized staff principal.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Admin route is not exposed on this hostname.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Rate limited.
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Security dependency unavailable.
      security:
        - Auth0OAuth:
            - admin:operations:read
          CloudflareAccess: []
      tags:
        - Admin Session
  /v1/assets:
    get:
      operationId: listAssets
      parameters:
        - in: query
          name: asset_type
          required: false
          schema:
            enum:
              - equity
              - etf
              - index
              - cash
            type: string
        - in: query
          name: symbol_prefix
          required: false
          schema:
            maxLength: 8
            minLength: 1
            pattern: ^[A-Za-z0-9.-]+$
            type: string
        - in: query
          name: cursor
          required: false
          schema:
            maxLength: 2048
            minLength: 20
            type: string
        - in: query
          name: limit
          required: false
          schema:
            default: 20
            maximum: 50
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetCollectionResponse"
          description: Published Asset Codex summaries.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid API access token.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Inactive account or missing permission.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Published asset not found.
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Request body exceeded the consumer cap.
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Request media type or encoding is unsupported.
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid bounded input.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Rate limited.
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Content storage unavailable.
      security:
        - Auth0OAuth:
            - read:self
      tags:
        - Assets
