components:
  parameters:
    IdempotencyKey:
      in: header
      name: idempotency-key
      required: true
      schema:
        maxLength: 64
        minLength: 16
        pattern: ^[\x21-\x7E]{16,64}$
        type: string
  responses:
    RateLimited:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: The applicable route and actor quota was exceeded.
      headers:
        Retry-After:
          schema:
            minimum: 1
            type: integer
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: A valid member access token is required.
    ValidationError:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: The request failed strict boundary validation.
  schemas:
    AdminSession:
      additionalProperties: false
      properties:
        display_label:
          maxLength: 120
          minLength: 1
          type: string
        staff_id:
          format: uuid
          type: string
      required:
        - staff_id
        - display_label
      type: object
    AdminSessionResponse:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/AdminSession"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
      required:
        - data
        - meta
      type: object
    ArtReference:
      additionalProperties: false
      properties:
        alt:
          maxLength: 240
          minLength: 1
          type: string
        key:
          enum:
            - the_compass
          type: string
      required:
        - key
        - alt
      type: object
    AssetCodexDetail:
      additionalProperties: false
      properties:
        appearance_reason:
          maxLength: 1000
          minLength: 1
          type: string
        asset_type:
          enum:
            - equity
            - etf
            - index
            - cash
          type: string
          x-enum-varnames:
            - equity
            - etf
            - marketIndex
            - cash
        currency:
          enum:
            - USD
          type: string
        demo:
          $ref: "#/components/schemas/DemoDisclosure"
        evidence:
          items:
            $ref: "#/components/schemas/EvidenceSummary"
          maxItems: 20
          minItems: 1
          type: array
        id:
          format: uuid
          type: string
        limitations:
          maxLength: 2000
          minLength: 1
          type: string
        metrics_as_of:
          format: date-time
          type: string
        name:
          maxLength: 120
          minLength: 1
          type: string
        revision_id:
          format: uuid
          type: string
        risks:
          items:
            additionalProperties: false
            properties:
              detail:
                maxLength: 2000
                minLength: 1
                type: string
              severity:
                enum:
                  - low
                  - medium
                  - high
                type: string
              title:
                maxLength: 120
                minLength: 1
                type: string
            required:
              - title
              - detail
              - severity
            type: object
          maxItems: 20
          minItems: 1
          type: array
        saved:
          type: boolean
        slug:
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          type: string
        symbol:
          maxLength: 16
          minLength: 1
          type: string
        thesis:
          maxLength: 10000
          minLength: 1
          type: string
      required:
        - id
        - slug
        - symbol
        - name
        - asset_type
        - currency
        - revision_id
        - appearance_reason
        - demo
        - thesis
        - risks
        - evidence
        - metrics_as_of
        - limitations
        - saved
      type: object
    AssetCollectionResponse:
      additionalProperties: false
      properties:
        data:
          items:
            $ref: "#/components/schemas/AssetSummary"
          type: array
        meta:
          $ref: "#/components/schemas/CollectionMeta"
      required:
        - data
        - meta
      type: object
    AssetComparison:
      additionalProperties: false
      properties:
        assets:
          items:
            additionalProperties: false
            properties:
              asset:
                $ref: "#/components/schemas/AssetSummary"
              latest_metric:
                $ref: "#/components/schemas/AssetMetric"
              risk_count:
                minimum: 0
                type: integer
            required:
              - asset
              - latest_metric
              - risk_count
            type: object
          maxItems: 5
          minItems: 2
          type: array
        compared_at:
          format: date-time
          type: string
        demo:
          $ref: "#/components/schemas/DemoDisclosure"
      required:
        - assets
        - compared_at
        - demo
      type: object
    AssetComparisonResponse:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/AssetComparison"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
      required:
        - data
        - meta
      type: object
    AssetDetailResponse:
