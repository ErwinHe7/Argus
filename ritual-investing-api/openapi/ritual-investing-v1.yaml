        provider_order_type:
          maxLength: 128
          minLength: 1
          type: string
        provider_side:
          maxLength: 128
          minLength: 1
          type: string
        provider_state:
          maxLength: 128
          minLength: 1
          type: string
        provider_time_in_force:
          maxLength: 128
          minLength: 1
          type: string
        quantity:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d{1,18})?$
          type: string
        side:
          enum:
            - buy
            - sell
            - unsupported
          type: string
        state:
          enum:
            - pending
            - partially_filled
            - filled
            - cancelled
            - rejected
            - expired
            - unknown
          type: string
        stop_price:
          nullable: true
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d{1,18})?$
          type: string
        symbol:
          maxLength: 32
          minLength: 1
          type: string
        terminal:
          type: boolean
        time_in_force:
          enum:
            - day
            - gtc
            - unsupported
          type: string
