info:
  description: Supabase Edge contract for Argus-owned member, editorial, privacy, and staff data. Brokerage routes are added only after the Webull protocol gate.
  title: Argus API
  version: 2.0.0
openapi: 3.0.3
paths:
  /v1/account:
    get:
      operationId: getAccount
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberAccountResponse"
          description: Argus response.
        "401":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                      field_errors:
                        items:
                          nullable: true
                        type: array
                      message:
                        type: string
                      request_id:
                        format: uuid
                        type: string
                      retryable:
                        type: boolean
                    required:
                      - code
                      - message
                      - request_id
                      - field_errors
                      - retryable
                    type: object
                required:
                  - error
                type: object
          description: Invalid Supabase access token.
        "403":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                      field_errors:
                        items:
                          nullable: true
                        type: array
                      message:
                        type: string
                      request_id:
                        format: uuid
                        type: string
                      retryable:
                        type: boolean
                    required:
                      - code
                      - message
                      - request_id
                      - field_errors
                      - retryable
                    type: object
                required:
                  - error
                type: object
          description: Owner or current staff authorization denied.
        "409":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                      field_errors:
                        items:
                          nullable: true
                        type: array
                      message:
                        type: string
                      request_id:
                        format: uuid
                        type: string
                      retryable:
                        type: boolean
                    required:
                      - code
                      - message
                      - request_id
                      - field_errors
                      - retryable
                    type: object
                required:
                  - error
                type: object
          description: Revision or idempotency conflict.
        "422":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                      field_errors:
                        items:
                          nullable: true
                        type: array
                      message:
                        type: string
                      request_id:
                        format: uuid
                        type: string
                      retryable:
                        type: boolean
                    required:
                      - code
                      - message
                      - request_id
                      - field_errors
                      - retryable
                    type: object
                required:
                  - error
                type: object
          description: Strict request validation failed.
        "429":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                      field_errors:
                        items:
                          nullable: true
                        type: array
                      message:
                        type: string
                      request_id:
                        format: uuid
                        type: string
                      retryable:
                        type: boolean
                    required:
                      - code
                      - message
                      - request_id
                      - field_errors
                      - retryable
                    type: object
                required:
                  - error
                type: object
          description: Rate limited.
        "503":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                      field_errors:
                        items:
                          nullable: true
                        type: array
                      message:
                        type: string
                      request_id:
                        format: uuid
                        type: string
                      retryable:
                        type: boolean
                    required:
                      - code
                      - message
                      - request_id
                      - field_errors
                      - retryable
                    type: object
                required:
                  - error
                type: object
          description: A required private dependency is unavailable.
      security:
