          items:
            $ref: "#/components/schemas/CircleTemplateSummary"
          type: array
        meta:
          $ref: "#/components/schemas/CollectionMeta"
      required:
        - data
        - meta
      type: object
    CircleTemplateDetail:
      additionalProperties: false
      properties:
        assets:
          items:
            additionalProperties: false
            properties:
              appearance_reason:
                maxLength: 1000
                minLength: 1
                type: string
              asset_type:
                enum:
                  - equity
                  - etf
                  - index
                  - cash
                type: string
                x-enum-varnames:
                  - equity
                  - etf
                  - marketIndex
                  - cash
              currency:
                enum:
                  - USD
                type: string
              demo:
                $ref: "#/components/schemas/DemoDisclosure"
              id:
                format: uuid
                type: string
              name:
                maxLength: 120
                minLength: 1
                type: string
              note:
                maxLength: 2000
                nullable: true
                type: string
              ordinal:
                maximum: 50
                minimum: 1
