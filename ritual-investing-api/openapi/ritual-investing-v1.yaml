              latest_metric:
                $ref: "#/components/schemas/AssetMetric"
              risk_count:
                minimum: 0
                type: integer
            required:
              - asset
              - latest_metric
              - risk_count
            type: object
          maxItems: 5
          minItems: 2
          type: array
        compared_at:
          format: date-time
          type: string
        demo:
          $ref: "#/components/schemas/DemoDisclosure"
      required:
        - assets
        - compared_at
        - demo
      type: object
    AssetComparisonResponse:
