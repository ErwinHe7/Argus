name: Ritual Investing

on:
  pull_request:
    paths:
      - ".github/workflows/ritual-investing.yml"
      - "ritual-investing-*/**"
      - "supabase/**"
      - "docs/ritual-investing/**"
      - "scripts/check-legacy-backend-removal.sh"
      - "scripts/check-supabase-deploy-target.ts"
      - "scripts/check-supabase-architecture-contract.sh"
      - "scripts/check-supabase-hosted-acceptance.sh"
      - "scripts/check-supabase-migration-inventory.sh"
      - "scripts/fence-supabase-deployment.sql"
      - "scripts/render-supabase-target-manifest.sql"
      - "scripts/check-no-ignored-sources.sh"
      - "scripts/check-member-provider-boundaries.sh"
      - "scripts/test-check-member-provider-boundaries.sh"
      - "scripts/check-demo-provider-boundaries.sh"
      - "scripts/test-check-demo-provider-boundaries.sh"
      - "scripts/test-check-supabase-architecture-contract.sh"
      - "scripts/test-check-supabase-migration-inventory.sh"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ritual-investing.yml"
      - "ritual-investing-*/**"
      - "supabase/**"
      - "docs/ritual-investing/**"
      - "scripts/check-legacy-backend-removal.sh"
      - "scripts/check-supabase-deploy-target.ts"
      - "scripts/check-supabase-architecture-contract.sh"
      - "scripts/check-supabase-hosted-acceptance.sh"
      - "scripts/check-supabase-migration-inventory.sh"
      - "scripts/fence-supabase-deployment.sql"
      - "scripts/render-supabase-target-manifest.sql"
      - "scripts/check-no-ignored-sources.sh"
      - "scripts/check-member-provider-boundaries.sh"
      - "scripts/test-check-member-provider-boundaries.sh"
      - "scripts/check-demo-provider-boundaries.sh"
      - "scripts/test-check-demo-provider-boundaries.sh"
      - "scripts/test-check-supabase-architecture-contract.sh"
      - "scripts/test-check-supabase-migration-inventory.sh"
  workflow_dispatch:
    inputs:
      run_staging:
        description: Run the hosted-development deployment and smoke proof
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ritual-investing-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.22.0
  FLUTTER_VERSION: 3.47.1
  SUPABASE_CLI_VERSION: 2.115.0

jobs:
  source-guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-no-ignored-sources.sh
      - run: ./scripts/check-legacy-backend-removal.sh

  member-provider-boundary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Exercise provider-boundary fail-closed cases
        run: ./scripts/test-check-member-provider-boundaries.sh
      - name: Audit member dependencies, hosts, egress, and worker effects
        run: ./scripts/check-member-provider-boundaries.sh

  demo-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - working-directory: ritual-investing-app
        run: flutter pub get --enforce-lockfile
      - working-directory: ritual-investing-app
        run: flutter analyze
      - working-directory: ritual-investing-app
        run: flutter test
      - working-directory: ritual-investing-demo
        run: flutter pub get --enforce-lockfile
      - working-directory: ritual-investing-demo
        run: flutter analyze
      - name: Fixture-backed Chrome curated journey and reset
        working-directory: ritual-investing-demo
        run: |
          chromedriver --port=4444 &
          flutter drive --driver=test_driver/integration_test.dart --target=integration_test/demo_browser_workflows_test.dart -d chrome
      - name: Build provider-neutral demo release
        working-directory: ritual-investing-demo
        run: >-
          flutter build web --release
          --no-web-resources-cdn
          --no-source-maps
          --no-wasm-dry-run
          --pwa-strategy=none
      - uses: actions/upload-artifact@v4
        with:
          name: ritual-demo-web-${{ github.sha }}
          path: ritual-investing-demo/build/web
          if-no-files-found: error
          retention-days: 7

  demo-provider-boundary:
    needs: demo-web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: ritual-demo-web-${{ github.sha }}
          path: ritual-investing-demo/build/web
      - name: Exercise demo provider-boundary fail-closed cases
        run: ./scripts/test-check-demo-provider-boundaries.sh
      - name: Audit transitive demo sources and release artifact
        run: ./scripts/check-demo-provider-boundaries.sh

  site:
    needs: demo-web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ritual-investing-site/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: ritual-demo-web-${{ github.sha }}
          path: ritual-investing-demo/build/web
      - working-directory: ritual-investing-site
        run: npm ci
      - working-directory: ritual-investing-site
        run: npm run typecheck
      - working-directory: ritual-investing-site
        run: npm test
      - name: Review high-severity direct and transitive advisories
        working-directory: ritual-investing-site
        run: npm audit --audit-level=high
      - working-directory: ritual-investing-site
        run: npm run assets:build
      - working-directory: ritual-investing-site
        run: npm run pages:config:check
      - uses: actions/upload-artifact@v4
        with:
          name: ritual-site-dist-${{ github.sha }}
          path: ritual-investing-site/dist
          if-no-files-found: error
          retention-days: 7

  site-waitlist-edge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - working-directory: supabase/functions/waitlist
        run: deno task check
      - working-directory: supabase/functions/waitlist
        run: deno task test

  site-browser:
    needs: [site, demo-provider-boundary]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ritual-investing-site/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: ritual-site-dist-${{ github.sha }}
          path: ritual-investing-site/dist
      - working-directory: ritual-investing-site
        run: npm ci
      - name: Install the exact Playwright browser set
        working-directory: ritual-investing-site
        run: npx playwright install --with-deps chromium firefox webkit
      - working-directory: ritual-investing-site
        run: npm run test:browser

  api-security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ritual-investing-api/package-lock.json
      - working-directory: ritual-investing-api
        run: npm ci
      - working-directory: ritual-investing-api
        run: npm run typecheck
      - working-directory: ritual-investing-api
        run: npm test
      - working-directory: ritual-investing-api
        run: npm run openapi:check
      - working-directory: ritual-investing-api
        run: npm run cutover:check

  supabase-local:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Exercise fail-closed Supabase architecture and history fixtures
        run: |
          ./scripts/test-check-supabase-architecture-contract.sh
          ./scripts/test-check-supabase-migration-inventory.sh
      - name: Verify exact boundary, history, and managed-resource inventories
        run: ./scripts/check-supabase-architecture-contract.sh --offline
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Require the exact reviewed Supabase CLI
        run: ./scripts/check-supabase-migration-inventory.sh --check-cli
      - name: Start the disposable local Supabase stack
        run: supabase start
      - name: Rebuild from the committed migration baseline
        run: supabase db reset
      - name: Record the first normalized replay target
        run: >-
          ./scripts/check-supabase-migration-inventory.sh
          --database-url postgresql://postgres:postgres@127.0.0.1:54322/postgres
          --print-target-manifest
          >"$RUNNER_TEMP/supabase-replay-target-first.txt"
      - name: Prove database contracts with pgTAP
        run: supabase test db
      - name: Fail on database lint errors
        run: supabase db lint --local --level error --fail-on error
      - name: Review local security advisors
        run: supabase db advisors --local --type security --fail-on error
      - name: Review local performance advisors
        run: supabase db advisors --local --type performance --fail-on error
      - name: Prove a second reset is identical and replay-safe
        run: supabase db reset
      - name: Compare the second normalized replay target exactly
        run: >-
          ./scripts/check-supabase-migration-inventory.sh
          --database-url postgresql://postgres:postgres@127.0.0.1:54322/postgres
          --compare-target-manifest
          "$RUNNER_TEMP/supabase-replay-target-first.txt"

  supabase-edge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - working-directory: supabase/functions/api
        run: deno task check && deno task test
      - working-directory: supabase/functions/webull-callback
        run: deno task check && deno task test
      - working-directory: supabase/functions/worker
        run: deno task check && deno task test
      - working-directory: supabase/functions/waitlist
        run: deno task check && deno task test

  contract-client:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ritual-investing-api/package-lock.json
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - working-directory: ritual-investing-api
        run: npm ci
      - working-directory: ritual-investing-api
        run: npm run drift:check
      - working-directory: ritual-investing-api-client
        run: dart pub get
      - working-directory: ritual-investing-api-client
        run: dart analyze
      - working-directory: ritual-investing-api-client
        run: dart test

  mobile-android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - working-directory: ritual-investing-app
        run: flutter pub get --enforce-lockfile
      - working-directory: ritual-investing-app
        run: flutter analyze
      - working-directory: ritual-investing-app
        run: flutter test
      - working-directory: ritual-investing-app
        run: >-
          flutter build apk --debug
          --dart-define=RITUAL_API_BASE_URL=https://abcdefghijklmnopqrst.supabase.co/functions/v1/api
          --dart-define=SUPABASE_URL=https://abcdefghijklmnopqrst.supabase.co
          --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_local_fixture_1234567890

  mobile-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - working-directory: ritual-investing-app
        run: flutter pub get --enforce-lockfile
      - working-directory: ritual-investing-app
        run: >-
          flutter build ios --debug --no-codesign
          --dart-define=RITUAL_API_BASE_URL=https://abcdefghijklmnopqrst.supabase.co/functions/v1/api
          --dart-define=SUPABASE_URL=https://abcdefghijklmnopqrst.supabase.co
          --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_local_fixture_1234567890

  member-integration-android:
    needs: member-provider-boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - working-directory: ritual-investing-app
        run: flutter pub get --enforce-lockfile
      - name: Generated-Dio member flow with ephemeral Android identity
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: >-
            cd ritual-investing-app &&
            flutter test integration_test/member_experience_test.dart
            -d emulator-5554
            --dart-define=RITUAL_API_BASE_URL=https://abcdefghijklmnopqrst.supabase.co/functions/v1/api
            --dart-define=SUPABASE_URL=https://abcdefghijklmnopqrst.supabase.co
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_local_fixture_1234567890
            --dart-define=RITUAL_MEMBER_TEST_ID=ci-${{ github.run_id }}-${{ github.run_attempt }}

  member-integration-ios:
    needs: member-provider-boundary
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - working-directory: ritual-investing-app
        run: flutter pub get --enforce-lockfile
      - name: Boot an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          device_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          test -n "$device_id"
          xcrun simctl boot "$device_id" || true
          xcrun simctl bootstatus "$device_id" -b
          echo "device_id=$device_id" >> "$GITHUB_OUTPUT"
      - name: Generated-Dio member flow with ephemeral iOS identity
        working-directory: ritual-investing-app
        run: >-
          flutter test integration_test/member_experience_test.dart
          -d ${{ steps.simulator.outputs.device_id }}
          --dart-define=RITUAL_API_BASE_URL=https://abcdefghijklmnopqrst.supabase.co/functions/v1/api
          --dart-define=SUPABASE_URL=https://abcdefghijklmnopqrst.supabase.co
          --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_local_fixture_1234567890
          --dart-define=RITUAL_MEMBER_TEST_ID=ci-${{ github.run_id }}-${{ github.run_attempt }}

  admin-web-browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ritual-investing-api/package-lock.json
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - working-directory: ritual-investing-admin
        run: flutter pub get --enforce-lockfile
      - working-directory: ritual-investing-admin
        run: flutter analyze
      - working-directory: ritual-investing-admin
        run: flutter test
      - working-directory: ritual-investing-admin
        run: >-
          flutter build web --release
          --dart-define=ADMIN_API_BASE_URL=https://abcdefghijklmnopqrst.supabase.co/functions/v1/api
          --dart-define=SUPABASE_URL=https://abcdefghijklmnopqrst.supabase.co
          --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_local_fixture_1234567890
      - name: Fixture-backed Chrome dashboard interaction (UI only)
        working-directory: ritual-investing-admin
        run: |
          chromedriver --port=4444 &
          flutter drive --driver=test_driver/integration_test.dart --target=integration_test/admin_browser_workflows_test.dart -d chrome \
            --dart-define=ADMIN_API_BASE_URL=https://abcdefghijklmnopqrst.supabase.co/functions/v1/api \
            --dart-define=SUPABASE_URL=https://abcdefghijklmnopqrst.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_local_fixture_1234567890

  supabase-hosted-development:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_staging)
    needs:
      [
        api-security,
        supabase-local,
        supabase-edge,
        contract-client,
        mobile-android,
        mobile-ios,
        member-integration-android,
        member-integration-ios,
        member-provider-boundary,
        admin-web-browser,
        demo-provider-boundary,
        demo-web,
        site,
        site-waitlist-edge,
        site-browser,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ritual-supabase-development
    concurrency:
      group: ritual-supabase-hosted-development
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      SUPABASE_PROJECT_URL: ${{ vars.SUPABASE_PROJECT_URL }}
      RITUAL_EXPECTED_REPOSITORY: ErwinHe7/Argus
      RITUAL_EXPECTED_SUPABASE_PROJECT_ID: ${{ vars.EXPECTED_SUPABASE_PROJECT_ID }}
      RITUAL_EXPECTED_SUPABASE_DB_HOST: ${{ vars.EXPECTED_SUPABASE_DB_HOST }}
      RITUAL_HOSTED_API_URL: ${{ vars.RITUAL_HOSTED_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Require the selected forward-only history and exact CLI
        run: ./scripts/check-supabase-migration-inventory.sh --check-cli
      - name: Reject every non-exact deployment target before mutation
        run: node --experimental-strip-types scripts/check-supabase-deploy-target.ts
      - name: Fence background and provider egress before schema mutation
        run: psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f scripts/fence-supabase-deployment.sql
      - name: Link only the verified hosted-development project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - name: Apply the reviewed schema before Edge functions
        run: supabase db push --include-all --include-seed --password "$SUPABASE_DB_PASSWORD"
      - name: Require all fences after clean-project bootstrap
        run: psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f scripts/fence-supabase-deployment.sql
      - name: Prove hosted migration state with pgTAP
        run: supabase test db --linked
      - name: Fail on hosted database lint errors
        run: supabase db lint --linked --level error --fail-on error
      - name: Fail on hosted security advisor errors
        run: supabase db advisors --linked --type security --fail-on error
      - name: Fail on hosted performance advisor errors
        run: supabase db advisors --linked --type performance --fail-on error
      - name: Record the normalized hosted target without secrets
        run: >-
          ./scripts/check-supabase-migration-inventory.sh
          --database-url "$SUPABASE_DB_URL"
          --print-target-manifest
          >"$RUNNER_TEMP/supabase-hosted-target.txt"
      - name: Record the immutable deployment revision
        run: supabase secrets set --project-ref "$SUPABASE_PROJECT_ID" ARGUS_BUILD_REVISION="$GITHUB_SHA"
      - name: Deploy callback, worker, waitlist, then API
        run: |
          supabase functions deploy webull-callback --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
          supabase functions deploy worker --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
          supabase functions deploy waitlist --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
          supabase functions deploy api --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
      - name: Prove hosted Auth, queues, Storage, limits, and Edge revision
        run: ./scripts/check-supabase-hosted-acceptance.sh
      - name: Resume background work only after hosted acceptance
        run: >-
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c
          "update argus_private.kill_switches set enabled=false,reason=null,
          updated_at=clock_timestamp() where name='background_workers'"
