  evidence-summary:
    needs: [source-release, axio7_rust, axio7_python, axio7_typescript, axio7_docker, axio7_native, prod_readiness, member-web-build, demo-browser, site-browser, supabase-local, mobile-android, mobile-ios, member-integration-android, member-integration-ios, admin-web-browser]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ritual-investing-site/package-lock.json
      - working-directory: ritual-investing-site
        run: npm ci
      - name: Record and verify exact-source prod evidence
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_ATTEMPT: ${{ needs.source-release.outputs.source_attempt }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          NATIVE_AVAILABILITY: ${{ needs.axio7_native.outputs.availability }}
          NATIVE_REASON: ${{ needs.axio7_native.outputs.reason }}
          PROD_TARGET_FINGERPRINT: ${{ needs.prod_readiness.outputs.target_fingerprint }}
          PROD_RUNNING_REVISION: ${{ needs.prod_readiness.outputs.running_revision }}
          READINESS_RESPONSE_SHA256: ${{ needs.prod_readiness.outputs.response_sha256 }}
          READINESS_OBSERVED_AT: ${{ needs.prod_readiness.outputs.observed_at }}
        run: |
          set -euo pipefail
          preflight_started_at="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          jq -n -S \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sourceRunId "$SOURCE_RUN_ID" --argjson sourceAttempt "$SOURCE_ATTEMPT" \
            --arg artifactId "$ARTIFACT_ID" --arg sourceSha "$SOURCE_SHA" \
            --arg archiveSha256 "$ARCHIVE_SHA256" --arg manifestSha256 "$MANIFEST_SHA256" \
            --arg nativeAvailability "$NATIVE_AVAILABILITY" --arg nativeReason "$NATIVE_REASON" \
            --arg targetFingerprint "$PROD_TARGET_FINGERPRINT" --arg runningRevision "$PROD_RUNNING_REVISION" \
            --arg responseSha256 "$READINESS_RESPONSE_SHA256" --arg observedAt "$READINESS_OBSERVED_AT" \
            --arg actor "$GITHUB_ACTOR" --arg evidenceWorkflow "$GITHUB_WORKFLOW" \
            --arg evidenceRef "$GITHUB_REF" --arg evidenceSha "$GITHUB_WORKFLOW_SHA" \
            --arg evidenceRunId "$GITHUB_RUN_ID" --argjson evidenceAttempt "$GITHUB_RUN_ATTEMPT" '
            {
              schemaVersion:"ritual-prod-evidence.v1",
              status:"ready",
              subject:{repository:$repository,sha:$sourceSha,runId:$sourceRunId,attempt:$sourceAttempt},
              controller:{workflow:"Ritual Investing Fast CI",ref:"refs/heads/main",sha:$sourceSha,runId:$sourceRunId,attempt:$sourceAttempt},
              source:{runId:$sourceRunId,attempt:$sourceAttempt,artifact:{id:$artifactId,archiveSha256:$archiveSha256,manifestSha256:$manifestSha256}},
              checks:{
                rust:{status:"passed"},python:{status:"passed"},typescript:{status:"passed"},docker:{status:"passed"},
                native:(if $nativeAvailability == "available" then {availability:"available",status:"passed",reason:null} else {availability:"unavailable",status:"not-run",reason:$nativeReason} end)
              },
              prodTarget:{fingerprint:$targetFingerprint,runningRevision:$runningRevision},
              readiness:{status:"ready",responseSha256:$responseSha256,observedAt:$observedAt},
              evidence:{actor:$actor,workflow:$evidenceWorkflow,ref:$evidenceRef,sha:$evidenceSha,runId:$evidenceRunId,attempt:$evidenceAttempt}
            }' >"$RUNNER_TEMP/prod-evidence.json"
          export PROD_EVIDENCE_VERIFICATION_CONTEXT="$(jq -cn \
            --arg repository "$GITHUB_REPOSITORY" --arg sourceSha "$SOURCE_SHA" \
            --arg sourceRunId "$SOURCE_RUN_ID" --argjson sourceAttempt "$SOURCE_ATTEMPT" \
            --arg artifactId "$ARTIFACT_ID" --arg archiveSha256 "$ARCHIVE_SHA256" \
            --arg manifestSha256 "$MANIFEST_SHA256" --arg targetFingerprint "$PROD_TARGET_FINGERPRINT" \
            --arg runningRevision "$PROD_RUNNING_REVISION" --arg evidenceRunId "$GITHUB_RUN_ID" \
            --arg evidenceActor "$GITHUB_ACTOR" --arg evidenceWorkflow "$GITHUB_WORKFLOW" \
            --arg evidenceRef "$GITHUB_REF" --arg evidenceSha "$GITHUB_WORKFLOW_SHA" \
            --argjson evidenceAttempt "$GITHUB_RUN_ATTEMPT" --arg preflightStartedAt "$preflight_started_at" '
            {
              expectedSubject:{repository:$repository,sha:$sourceSha,runId:$sourceRunId,attempt:$sourceAttempt},
              expectedController:{workflow:"Ritual Investing Fast CI",ref:"refs/heads/main",sha:$sourceSha,runId:$sourceRunId,attempt:$sourceAttempt},
              expectedArtifact:{id:$artifactId,archiveSha256:$archiveSha256,manifestSha256:$manifestSha256},
              expectedProdTargetFingerprint:$targetFingerprint,expectedRunningRevision:$runningRevision,
              expectedEvidence:{actor:$evidenceActor,workflow:$evidenceWorkflow,ref:$evidenceRef,sha:$evidenceSha,runId:$evidenceRunId,attempt:$evidenceAttempt},
              preflightStartedAt:$preflightStartedAt
            }')"
          npm --prefix ritual-investing-site run --silent release:receipt:verify -- \
            --prod-evidence "$RUNNER_TEMP/prod-evidence.json"
          sha256sum "$RUNNER_TEMP/prod-evidence.json" >"$RUNNER_TEMP/prod-evidence.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ritual-prod-evidence-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/prod-evidence.json
            ${{ runner.temp }}/prod-evidence.sha256
          if-no-files-found: error
          retention-days: 30
