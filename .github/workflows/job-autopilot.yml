name: job-autopilot

on:
  pull_request:
    paths:
      - "job-autopilot/**"
      - ".github/workflows/job-autopilot.yml"
  # Run manually from the Actions tab to deploy to <name>.<subdomain>.workers.dev.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: job-autopilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: job-autopilot/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx wrangler deploy --dry-run --outdir dist
      - run: npm test
        env:
          CHROME_PATH: /usr/bin/google-chrome

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: job-autopilot
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: job-autopilot/package-lock.json
      - run: npm ci
      - run: npx wrangler deploy
      - name: Set Worker secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ACCESS_CODE: ${{ secrets.JOB_AUTOPILOT_ACCESS_CODE }}
        run: |
          set -euo pipefail
          test -n "$ANTHROPIC_API_KEY" && test -n "$ACCESS_CODE"
          printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY
          printf '%s' "$ACCESS_CODE" | npx wrangler secret put ACCESS_CODE
