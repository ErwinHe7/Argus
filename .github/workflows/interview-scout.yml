name: interview-scout

# Pull requests run the checks. Merging to main runs the checks, deploys to
# interview-scout.<subdomain>.workers.dev (plus any CUSTOM_DOMAIN), and
# smoke-tests the live site.
on:
  pull_request:
    paths:
      - "interview-scout/**"
      - ".github/workflows/interview-scout.yml"
  push:
    branches: [main]
    paths:
      - "interview-scout/**"
      - ".github/workflows/interview-scout.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: interview-scout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: interview-scout/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx wrangler deploy --dry-run --outdir dist
      - run: npm test
        env:
          CHROME_PATH: /usr/bin/google-chrome

  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: interview-scout-deploy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: interview-scout
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ACCESS_CODE: ${{ secrets.INTERVIEW_SCOUT_ACCESS_CODE }}
      # Optional repository variable, e.g. "interview-scout.dev www.interview-scout.dev".
      # The domain must already be a zone in this Cloudflare account.
      CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: interview-scout/package-lock.json
      - name: Check deploy secrets
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Add the $name repository secret to deploy. See interview-scout/README.md."
              exit 1
            fi
          done
          if [ -z "$ANTHROPIC_API_KEY" ] || [ -z "$ACCESS_CODE" ]; then
            echo "::warning::ANTHROPIC_API_KEY or INTERVIEW_SCOUT_ACCESS_CODE is not set. The site deploys, but its API stays locked until both secrets are added and this workflow runs again."
          fi
      - run: npm ci
      - name: Deploy
        run: |
          set -euo pipefail
          args=()
          for domain in $CUSTOM_DOMAIN; do args+=(--domain "$domain"); done
          if [ -n "$ANTHROPIC_API_KEY" ] && [ -n "$ACCESS_CODE" ]; then
            # Uploaded with this version. The file never leaves the runner's temp dir.
            secrets_file="$RUNNER_TEMP/worker-secrets.json"
            trap 'rm -f "$secrets_file"' EXIT
            ( umask 077; node -e 'process.stdout.write(JSON.stringify({ ANTHROPIC_API_KEY: process.env.ANTHROPIC_API_KEY, ACCESS_CODE: process.env.ACCESS_CODE }))' > "$secrets_file" )
            args+=(--secrets-file "$secrets_file")
          fi
          npx wrangler deploy "${args[@]}" | tee deploy.log
          url="$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)"
          for domain in $CUSTOM_DOMAIN; do url="https://$domain"; break; done
          test -n "$url"
          echo "SITE_URL=$url" >> "$GITHUB_ENV"
      - name: Smoke test the live site
        run: |
          set -euo pipefail
          # A new custom domain can take a few minutes to get its certificate.
          for attempt in $(seq 1 18); do
            if curl -fsS "$SITE_URL/" | grep -q "Interview Scout" && curl -fsS "$SITE_URL/api/companies" | grep -q '"companies"'; then
              echo "Live at $SITE_URL"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$SITE_URL did not serve the site after deploy."
          exit 1
